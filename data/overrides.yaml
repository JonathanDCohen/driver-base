# data/overrides.yaml — hand-patched field values for individual drivers.
#
# Applied post-merge, right before drivers.json is written. Each overridden
# field is stamped `spec_source: override` so the web UI can flag it with the
# "inferred or derived" sigil.
#
# Use sparingly. This is for cases where the manufacturer's own published
# spec is wrong (typo, obvious data-entry error) and we have high confidence
# in the correct value from another source on the same page (URL, product
# name, feature bullets, datasheet PDF).
#
# Structure:
#
#   overrides:
#     {canonical_id}:
#       reason: "why this override exists — informational, not written to drivers.json"
#       fields:
#         {field_name}: {value}
#         ...
#
# Unknown field names raise on load; typos fail loudly.

overrides:
  dayton__ss18_22__2ohm:
    reason: >
      Dayton's product-page spec table lists "Nominal Diameter: 15\"" for the
      SS18-22, but every other signal on the page (product URL slug
      `ss18-22-18-signature-series-...`, model number, feature-bullet
      "Nominal Diameter: 18\"", 470 mm overall outside diameter) confirms it
      is an 18" driver.
    fields:
      nominal_size_mm: 457.2
