<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect x="0" y="0" width="64" height="64" rx="10" ry="10" fill="#00796B"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(32 32) scale(1.35) translate(-23 -32)">
    <!-- Voice coil: squared-off monospace 0 -->
    <rect x="12" y="22" width="12" height="20" rx="3" ry="3"/>

    <!-- Cone: 1 with stem and base -->
    <path d="M 30 14 L 30 50 M 24 50 L 36 50"/>

    <!-- Flag of the 1 continuing as the slash through the 0 -->
    <line x1="30" y1="14" x2="10" y2="44"/>
  </g>
</svg>
